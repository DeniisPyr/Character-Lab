[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "charlab"
dynamic = ["version"]
description = "Turn one character image into a training-ready LoRA dataset."
license = "MIT"
authors = [{ name = "DenisPyr" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Models for a real run. rembg runs on the CPU; it is fast enough for one image per run.
gpu = [
    "accelerate>=1.0",
    # 0.37 adds the zero_cond_t option that Qwen-Image-Edit-2511 needs; older versions ignore it
    # with only a warning and the images come out wrong.
    "diffusers>=0.37",
    # For the gguf transformer setting; diffusers needs 0.10 or newer.
    "gguf>=0.10",
    "peft>=0.17",
    "rembg[cpu]>=2.0.85",
    "torch>=2.6",
    # transformers loads Qwen's processor together with a video processor that needs torchvision.
    "torchvision>=0.21",
    # transformers 5 needs mm_token_type_ids, which diffusers does not pass to the Qwen2.5-VL
    # text encoder yet, so image tokens get wrong positions (diffusers issue #14194). This also
    # caps diffusers at 0.39, the last release that allows huggingface-hub below 1.0.
    "transformers>=4.57,<5",
]
dev = [
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff==0.16.10",
]

[project.scripts]
charlab = "charlab.cli:main"

[tool.hatch.version]
path = "src/charlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/charlab"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
