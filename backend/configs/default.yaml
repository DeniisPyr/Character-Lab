# Pipeline settings. A user config only needs the values it changes; it is merged over these
# defaults key by key. Relative paths are resolved from the file that sets them.
#
# Settings for later stages (captions, quality gate, quantization) are added with the stage
# that uses them, with measured values, not placeholders.

# Base seed. The same seed and settings reproduce the same images.
seed: 42

recipe: recipes/lora-character.yaml

prepare:
  # Limits for the reference image, checked before its pixels are decoded.
  max_file_mb: 20
  max_pixels: 25_000_000
  # The generator encodes reference images at about 1 megapixel; much smaller ones lose detail.
  min_side: 512
  # auto: no model when the image is transparent or its border is one plain colour, otherwise
  # the model cuts the subject out and puts it on white. remove: use the model on plain colours
  # too. keep: use the image as it is, without cropping.
  background: auto
  # rembg model. birefnet-general handles photos and drawings; isnet-anime is about 10x faster
  # and gives smoother hair on drawn characters, but is less reliable on photos.
  background_model: birefnet-general
  # Space left around the subject when cropping, as a share of its longer side.
  crop_margin: 0.05

generation:
  model: Qwen/Qwen-Image-Edit-2511
  # bf16: the full transformer, all on the GPU. Needs an 80 GB GPU (about 62 GB measured on
  # an A100); the first run downloads about 58 GB.
  # gguf: a quantized transformer, and each model moves to the GPU only while it runs, for
  # 24 GB GPUs; the first run downloads about 34 GB.
  transformer: bf16
  gguf:
    repo: unsloth/Qwen-Image-Edit-2511-GGUF
    # Q6_K (16.9 GB) is the closest to bf16 that should fit 24 GB; Q5_K_M (15.0 GB) and
    # Q4_K_M (13.2 GB) leave more room.
    file: qwen-image-edit-2511-Q6_K.gguf
  lightning_lora:
    repo: lightx2v/Qwen-Image-Edit-2511-Lightning
    file: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
  # The Lightning LoRA is distilled for 4 steps without classifier-free guidance (CFG 1).
  steps: 4
  cfg: 1.0
