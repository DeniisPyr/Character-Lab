# Pipeline settings. A user config only needs the values it changes; it is merged over these
# defaults key by key. Relative paths are resolved from the file that sets them.
#
# Settings for later stages (face refinement, quality gate) are added with the stage that uses
# them, with measured values, not placeholders.

# Base seed. The same seed and settings reproduce the same images.
seed: 42

recipe: recipes/lora-character.yaml

# The kind of character, which picks the models that check faces and identity. Only anime
# (illustrated characters) for now; realistic comes later.
style: anime

prepare:
  # Limits for the reference image, checked before its pixels are decoded.
  max_file_mb: 20
  max_pixels: 25_000_000
  # The generator encodes reference images at about 1 megapixel; much smaller ones lose detail.
  min_side: 512
  # auto: no model when the image is transparent or its border is one plain colour, otherwise
  # the model cuts the subject out and puts it on white. remove: use the model on plain colours
  # too. keep: use the image as it is, without cropping.
  background: auto
  # rembg model. birefnet-general handles photos and drawings; isnet-anime is about 10x faster
  # and gives smoother hair on drawn characters, but is less reliable on photos.
  background_model: birefnet-general
  # Space left around the subject when cropping, as a share of its longer side.
  crop_margin: 0.05

generation:
  model: Qwen/Qwen-Image-Edit-2511
  # bf16: the full transformer, all on the GPU. Needs an 80 GB GPU (about 62 GB measured on
  # an A100); the first run downloads about 58 GB.
  # gguf: a quantized transformer, and each model moves to the GPU only while it runs, for
  # 24 GB GPUs; the first run downloads about 34 GB.
  transformer: bf16
  gguf:
    repo: unsloth/Qwen-Image-Edit-2511-GGUF
    # Q6_K (16.9 GB) is the closest to bf16 that should fit 24 GB; Q5_K_M (15.0 GB) and
    # Q4_K_M (13.2 GB) leave more room.
    file: qwen-image-edit-2511-Q6_K.gguf
  lightning_lora:
    repo: lightx2v/Qwen-Image-Edit-2511-Lightning
    file: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
  # The Lightning LoRA is distilled for 4 steps without classifier-free guidance (CFG 1).
  steps: 4
  cfg: 1.0

quality:
  # Anime face detector: YOLOv8 from DeepGHS, run on the CPU with onnxruntime (MIT, 45 MB).
  face_detector:
    repo: deepghs/anime_face_detection
    file: face_detect_v1.4_s/model.onnx
  # The model's F1-optimal confidence. It found one face in each of 15 generated images, at
  # 0.79-0.86, and none in the back view.
  face_confidence: 0.307
  # Anime identity: CCIP from DeepGHS (OpenRAIL), a feature model (150 MB) and the small model
  # that compares two features. It compares whole images, so it works on the back view too.
  ccip_features:
    repo: deepghs/ccip_onnx
    file: ccip-caformer-24-randaug-pruned/model_feat.onnx
  ccip_metric:
    repo: deepghs/ccip_onnx
    file: ccip-caformer-24-randaug-pruned/model_metrics.onnx

  # The gate checks each image as soon as it is made; a failed image is made again with a new
  # seed, up to this many tries in all. If none passes, the best one is kept and reported.
  max_attempts: 3
  # Limits, set from 16 generated images of one character (2026-10):
  # - CCIP difference below this counts as the same character (CCIP's F1-optimal value).
  #   Ours scored 0.008-0.063; 12 other anime characters scored 0.32-0.48.
  same_character_below: 0.1785
  # - The face's shorter side, in pixels. Ours: 79 (side view) to 423.
  min_face_px: 64
  # - Face sharpness as a share of the reference face's (variance of the Laplacian). Ours:
  #   0.14x and up; small or dark faces score low. A blurred copy scored 0.02x.
  min_sharpness: 0.07
  # - Near-duplicates are reported in report.json, not rejected: pairs whose 64-bit
  #   fingerprints differ in this many bits or fewer. A re-saved copy differs in 0; distinct
  #   shots on white differed in as few as 5 (front vs back view).
  duplicate_max_bits: 2

face_repair:
  # Which faces get redrawn with the generator, right after the quality gate:
  # - failed: only faces that still fail the gate after every attempt (the safe default;
  #   in our runs every image passed, so it rarely runs)
  # - small: also faces whose shorter side is below small_below_px, even if they passed
  # - off: never
  mode: failed
  small_below_px: 128
  # Give the generator a close-up of the reference's face as Picture 2, to anchor the face.
  # With a front-facing reference, a repair once drew a front face over a side profile; the
  # checks below rejected it.
  use_reference: true
  # A repaired face replaces the original only if the image keeps its structure and gets
  # better. Limits from a GPU experiment (2026-10-11): good repairs kept a layout similarity
  # of 0.99-1.00 and moved the face at most 0.10x its size; a repair that drew a front face
  # over a side profile scored 0.74 and 0.57x.
  min_layout_similarity: 0.95
  max_face_shift: 0.25
  # How much worse (higher) the CCIP difference may get; small changes are noise.
  identity_tolerance: 0.01

caption:
  # Florence-2 large in transformers' own format, so no remote code runs. 1.55 GB; fast
  # enough on a CPU or a Mac too.
  model: florence-community/Florence-2-large
  # On generated images, the paragraph task got outfit, pose, view and background right far
  # more often; <DETAILED_CAPTION> invented details (a hair bun, black heels).
  task: "<MORE_DETAILED_CAPTION>"
  num_beams: 3
  max_new_tokens: 512
