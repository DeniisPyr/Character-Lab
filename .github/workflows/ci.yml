name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Linting is the same on every OS, so it runs once; the tests run on all three.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Lint and test, os: ubuntu-latest, lint: true }
          - { name: Test on macOS, os: macos-latest }
          - { name: Test on Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        if: matrix.lint
        run: python -m ruff check .

      - name: Check formatting
        if: matrix.lint
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest
