name: Pages

# Builds the showcase page from frontend/ and examples/diana/. Pull requests only build it, so a
# broken page shows before merging; pushes to main also publish it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: [frontend/**, examples/**, .github/workflows/pages.yml]
  pull_request:
    paths: [frontend/**, examples/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install "pillow>=11.0"
          python frontend/build.py --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
